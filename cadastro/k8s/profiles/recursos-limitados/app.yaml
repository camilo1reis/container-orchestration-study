apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadastro-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadastro-api
  template:
    metadata:
      labels:
        app: cadastro-api
    spec:
      containers:
        - name: cadastro-api
          image: cadastro-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/cadastro_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "cadastro_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadastro-credentials
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cadastro-credentials
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: cadastro-api
  namespace: default
spec:
  type: NodePort
  selector:
    app: cadastro-api
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
