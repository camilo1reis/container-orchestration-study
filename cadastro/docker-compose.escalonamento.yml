services:
  mysql-escalonamento:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env.compose
    volumes:
      - mysql_escalonamento_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - escalonamento

  app-compose:
    image: cadastro-app:latest
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-escalonamento:3306/cadastro_db?serverTimezone=UTC"
    ports:
      - target: 8081
        published: "0"
        protocol: tcp
        mode: ingress
    depends_on:
      mysql-escalonamento:
        condition: service_healthy
    networks:
      - escalonamento

  nginx-escalonamento:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./monitoramento/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-compose
    networks:
      - escalonamento

volumes:
  mysql_escalonamento_data:
    name: cadastro_compose_escalonamento_mysql_data

networks:
  escalonamento:
    driver: bridge
